[package]
name = "ac_port"
version = "0.1.0"
edition = "2024"
description = "Clean-room recreation of Assassin's Creed (2008) player movement in Bevy. Loads the animations and character from your own copy of the game at runtime."
publish = false

[dependencies]
bevy = "0.19.1"

# Fast iteration: optimise dependencies, keep our own crate debuggable.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Zero-data validation boundary (see docs/VALIDATION.md and
# scripts/check-zero-data.sh). Declared explicitly so the required-data gate is
# a named, discoverable test target rather than relying on path autodiscovery.
[[test]]
name = "zero_data_boundary"
path = "tests/zero_data_boundary.rs"
